name: Build AI锦衣卫 Windows Agent

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Agent 局域网服务地址；也可以使用仓库变量 AGENT_SERVER_URL"
        required: false
        type: string
  push:
    paths:
      - "agent/**"
      - ".github/workflows/build-agent-windows.yml"

permissions:
  contents: read

jobs:
  build-msi:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent
    env:
      AGENT_SERVER_URL: ${{ inputs.server_url || vars.AGENT_SERVER_URL || '' }}
      AGENT_REGISTRATION_CODE: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Verify release versions
        shell: pwsh
        run: |
          $tauri = Get-Content "src-tauri/tauri.conf.json" | ConvertFrom-Json
          $package = Get-Content "package.json" | ConvertFrom-Json
          $cargoVersion = (Select-String -Path "src-tauri/Cargo.toml" -Pattern '^version = "([^"]+)"').Matches.Groups[1].Value
          $versions = @($tauri.version, $package.version, $cargoVersion) | Select-Object -Unique
          if ($versions.Count -ne 1) { throw "Agent version mismatch: $($versions -join ', ')" }
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tagVersion = $env:GITHUB_REF_NAME.Substring(1)
            if ($tagVersion -ne $tauri.version) { throw "Git tag $tagVersion does not match Agent version $($tauri.version)" }
          }

      - name: Check Windows Rust target
        run: cargo check --target x86_64-pc-windows-msvc --locked
        working-directory: agent/src-tauri

      - name: Test Windows metadata capture helpers
        run: cargo test --target x86_64-pc-windows-msvc --locked --no-fail-fast
        working-directory: agent/src-tauri

      - name: Write enrollment config
        shell: pwsh
        run: |
          $config = @{
            server_url = $env:AGENT_SERVER_URL
            registration_code = $env:AGENT_REGISTRATION_CODE
          } | ConvertTo-Json -Compress
          Set-Content -Path "src-tauri/resources/agent-config.json" -Value $config -Encoding UTF8

      - name: Install frontend dependencies
        run: npm ci

      - name: Build MSI
        shell: pwsh
        run: |
          $attempts = 3
          $exitCode = 1
          for ($attempt = 1; $attempt -le $attempts; $attempt++) {
            Write-Host "Building MSI (attempt $attempt/$attempts)"
            npm run tauri:build
            $exitCode = $LASTEXITCODE
            if ($exitCode -eq 0) {
              break
            }
            if ($attempt -lt $attempts) {
              $delay = 30 * $attempt
              Write-Host "Build failed with exit code $exitCode; retrying in $delay seconds"
              Start-Sleep -Seconds $delay
            }
          }
          exit $exitCode

      - name: Sign MSI for versioned releases
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_PASSWORD)) {
            throw "Versioned MSI releases require WINDOWS_SIGNING_PFX_BASE64 and WINDOWS_SIGNING_PFX_PASSWORD repository secrets"
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "ai-jinyiwei-signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64))
          $signtool = Get-ChildItem "$env:ProgramFiles(x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "Windows SDK signtool.exe was not found" }
          Get-ChildItem "src-tauri\target\release\bundle\msi\*.msi" | ForEach-Object {
            & $signtool.FullName sign /fd SHA256 /f $pfxPath /p $env:WINDOWS_SIGNING_PFX_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($_.Name)" }
            $signature = Get-AuthenticodeSignature $_.FullName
            if ($signature.Status -ne "Valid") { throw "MSI signature is not valid for $($_.Name): $($signature.Status)" }
          }

      - name: Create release manifest
        shell: pwsh
        run: |
          $package = Get-Content "package.json" | ConvertFrom-Json
          $artifacts = Get-ChildItem "src-tauri\target\release\bundle\msi\*.msi" | ForEach-Object {
            $signature = Get-AuthenticodeSignature $_.FullName
            @{
              file = $_.Name
              sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
              signature_status = $signature.Status.ToString()
              signer = if ($signature.SignerCertificate) { $signature.SignerCertificate.Subject } else { $null }
            }
          }
          @{
            product = "AI锦衣卫 Agent"
            agent_version = $package.version
            commit = $env:GITHUB_SHA
            generated_at_utc = (Get-Date).ToUniversalTime().ToString("o")
            artifacts = @($artifacts)
          } | ConvertTo-Json -Depth 5 | Set-Content -Path "release-manifest.json" -Encoding UTF8
          New-Item -ItemType Directory -Force -Path "release-assets" | Out-Null
          Copy-Item "src-tauri\target\release\bundle\msi\*.msi" "release-assets\"
          Copy-Item "release-manifest.json" "release-assets\"

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-jinyiwei-agent-msi
          path: agent/release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-msi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed MSI
        uses: actions/download-artifact@v4
        with:
          name: ai-jinyiwei-agent-msi
          path: release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/*.msi release/release-manifest.json --title "AI锦衣卫 Agent ${GITHUB_REF_NAME}" --generate-notes
