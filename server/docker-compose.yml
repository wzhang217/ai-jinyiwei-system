services:
  agent-server:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      # Keep the app port private; terminate HTTPS in Caddy/Nginx on the host.
      - "127.0.0.1:8787:8787"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
